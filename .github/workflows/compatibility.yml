name: macOS adapter compatibility
on:
  push:
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        core: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: matrix.core == 'latest'
        run: git -C core fetch origin main && git -C core checkout --detach origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r core/requirements.txt
      - run: python -m unittest discover -s core/tests -v
      - run: python core/platform_adapter.py --adapter adapter.json --describe
      - run: python macos_adapter.py --help
      - run: python macos_adapter.py doctor
